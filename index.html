<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>출고 적재 계산기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:15px;}
:root{--blue:#2563eb;--green:#16a34a;--red:#dc2626;--orange:#ea580c;--gray:#6b7280;--light:#f8fafc;--border:#e2e8f0;}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* 로그인 */
#loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:30px 20px;background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);}
.login-logo{font-size:42px;margin-bottom:8px;}
.login-title{color:#fff;font-size:22px;font-weight:700;margin-bottom:4px;}
.login-sub{color:#bfdbfe;font-size:13px;margin-bottom:32px;}
.login-card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,0.2);}
.login-label{font-size:13px;color:var(--gray);font-weight:600;margin-bottom:8px;display:block;}
.user-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.user-btn{padding:12px 8px;border:2px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;text-align:center;transition:all .15s;}
.user-btn:hover{border-color:var(--blue);background:#eff6ff;}
.user-btn.selected{border-color:var(--blue);background:#eff6ff;}
.user-btn .name{font-size:14px;font-weight:600;color:#1a1a2e;}
.user-btn .role{font-size:11px;color:var(--gray);margin-top:2px;}
.login-go{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;}
.login-go:disabled{background:#94a3b8;cursor:not-allowed;}

/* 헤더 */
.header{background:var(--blue);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.header-title{font-size:17px;font-weight:700;}
.header-user{font-size:12px;opacity:.85;}
.logout-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;}

/* 탭 */
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:52px;z-index:90;}
.tab{flex:1;padding:12px 4px;border:none;background:none;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}

/* 콘텐츠 */
.content{flex:1;padding:16px;overflow-y:auto;}
.section{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.section-title{font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:12px;display:flex;align-items:center;gap:6px;}

/* 검색 */
.search-wrap{position:relative;margin-bottom:10px;}
.search-input{width:100%;padding:12px 14px 12px 40px;border:2px solid var(--border);border-radius:10px;font-size:15px;outline:none;}
.search-input:focus{border-color:var(--blue);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--gray);}
.dropdown{background:#fff;border:2px solid var(--border);border-radius:10px;max-height:220px;overflow-y:auto;margin-bottom:8px;display:none;}
.dropdown.show{display:block;}
.dropdown-item{padding:11px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:14px;}
.dropdown-item:last-child{border-bottom:none;}
.dropdown-item:hover{background:#eff6ff;}
.dropdown-item .cat{font-size:11px;color:var(--gray);}

/* 입력 */
.input-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.input-label{font-size:13px;color:var(--gray);white-space:nowrap;min-width:60px;}
input[type=number],input[type=text]{flex:1;padding:10px 12px;border:2px solid var(--border);border-radius:8px;font-size:15px;outline:none;}
input:focus{border-color:var(--blue);}
.btn{padding:11px 16px;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-gray{background:#e5e7eb;color:#374151;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:7px;}
.btn:active{transform:scale(.97);}

/* 캡 토글 */
.cap-toggle-wrap{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fefce8;border:2px solid #fde047;border-radius:9px;margin-bottom:10px;}
.cap-toggle-label{font-size:13px;font-weight:600;color:#713f12;flex:1;}
.cap-toggle{display:flex;border:2px solid #d97706;border-radius:7px;overflow:hidden;}
.cap-toggle button{padding:6px 14px;border:none;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#92400e;}
.cap-toggle button.active{background:#d97706;color:#fff;}

/* 목록 */
.product-list{display:flex;flex-direction:column;gap:8px;}
.product-item{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px;}
.product-item-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.product-name{font-size:14px;font-weight:700;}
.product-qty{font-size:13px;color:var(--blue);font-weight:600;}
.product-cap{font-size:12px;color:var(--gray);margin-top:3px;}
.product-cap.excluded{color:var(--orange);text-decoration:line-through;}
.item-actions{display:flex;gap:5px;margin-top:8px;}

/* 적재 결과 */
.result-card{border-radius:12px;padding:16px;margin-bottom:12px;text-align:center;}
.result-ok{background:#dcfce7;border:2px solid #86efac;}
.result-warn{background:#fef3c7;border:2px solid #fcd34d;}
.result-over{background:#fee2e2;border:2px solid #fca5a5;}
.result-title{font-size:18px;font-weight:800;margin-bottom:4px;}
.result-sub{font-size:13px;color:var(--gray);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.stat-box{background:#f8fafc;border-radius:10px;padding:12px;text-align:center;}
.stat-val{font-size:22px;font-weight:800;color:var(--blue);}
.stat-lbl{font-size:11px;color:var(--gray);margin-top:2px;}

/* 차량 */
.vehicle-info{background:#eff6ff;border-radius:10px;padding:12px;margin-bottom:12px;}
.vehicle-title{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:6px;}
.vehicle-detail{font-size:13px;color:#1e40af;}

/* 파렛트 */
.pallet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.pallet-btn{padding:10px;border:2px solid var(--border);border-radius:9px;background:#fff;cursor:pointer;text-align:center;font-size:13px;font-weight:600;transition:all .15s;}
.pallet-btn.selected{border-color:var(--green);background:#f0fdf4;color:var(--green);}
.pallet-count-row{display:flex;align-items:center;gap:10px;}
.pallet-count-row input{width:80px;flex:none;}

/* 지원팀 목록 */
.order-card{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.order-id{font-size:12px;color:var(--gray);}
.order-time{font-size:12px;color:var(--gray);}
.order-status{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;}
.status-new{background:#fef3c7;color:#92400e;}
.status-done{background:#dcfce7;color:#166534;}
.order-products{margin:6px 0;}
.order-product-row{font-size:13px;padding:4px 0;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;}
.order-product-row:last-child{border-bottom:none;}
.order-vehicle{font-size:13px;color:#1e40af;margin-top:6px;padding:6px 10px;background:#eff6ff;border-radius:7px;}
.order-actions{display:flex;gap:6px;margin-top:10px;}

/* 인쇄 버튼 */
.print-btn{background:#7c3aed;color:#fff;border:none;padding:11px 16px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;width:100%;justify-content:center;margin-top:10px;}

/* 알림 */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:12px 22px;border-radius:25px;font-size:14px;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

/* DB 업로드 탭 */
.upload-area{border:3px dashed var(--border);border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:all .2s;}
.upload-area:hover{border-color:var(--blue);background:#eff6ff;}
.upload-icon{font-size:40px;margin-bottom:10px;}
.upload-text{font-size:15px;font-weight:600;color:var(--gray);}
.upload-sub{font-size:12px;color:#94a3b8;margin-top:4px;}

/* 차량 관리 */
.vehicle-card{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;}
.vehicle-num{font-size:18px;font-weight:800;color:var(--blue);}
.vehicle-meta{font-size:13px;color:var(--gray);margin-top:3px;}

/* 인쇄 스타일 */
@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { position: fixed; top: 0; left: 0; width: 100%; padding: 20px; }
  .no-print { display: none !important; }
}

/* 공통 */
.empty-msg{text-align:center;color:var(--gray);padding:30px;font-size:14px;}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;}
.badge-cap{background:#fef3c7;color:#92400e;}
.badge-nocap{background:#f3f4f6;color:#6b7280;}
.divider{height:1px;background:var(--border);margin:12px 0;}

/* qty 버튼 */
.qty-btn{width:32px;height:32px;border:1.5px solid var(--border);border-radius:7px;background:#fff;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
</style>
</head>

// ===== 차량 고정 규격 (m) =====
const VEH_W = 2.4;   // 폭 고정
const VEH_H = 2.5;   // 높이 고정
const PAL_L = 1.460; // 파렛트 길이 (m)
const PAL_W = 1.130; // 파렛트 폭 (m)
const PAL_H = 0.150; // 파렛트 높이 (m)

// ===========================
// ★ 핵심 부피 계산 함수 (수정)
// 박스 치수 단위: mm → 부피 단위: m³
// mm³ → m³ : /1,000,000,000 (1e9)
// ===========================
function boxVol_m3(l_mm, w_mm, h_mm, count) {
  if (!l_mm || !w_mm || !h_mm) return 0;
  return (l_mm * w_mm * h_mm * count) / 1e9;
}

function calcOrderVolume(items) {
  let prodVol = 0, capVol = 0;
  items.forEach(it => {
    // 제품 박스 부피
    prodVol += boxVol_m3(it.bl, it.bw, it.bh, it.boxes);
    // 캡 박스 부피 (포함된 경우만)
    if (it.capIncluded && it.capBoxes > 0 && it.capName) {
      const cb = CAP_BOXES[it.capName] || CAP_BOXES[(it.capName||'').trim()];
      if (cb) capVol += boxVol_m3(cb.l, cb.w, cb.h, it.capBoxes);
    }
  });
  return { prodVol, capVol, totalVol: prodVol + capVol };
}

// 파렛트 계산
// - 제품 박스를 파렛트 위에 쌓아서 차량에 적재
// - 파렛트는 높이에만 영향: 150mm 고정 차감 (수량 무관, 1단)
// - 파렛트 수량은 적재함 길이에 영향 없음
function calcPalletInfo(palletIncluded, palletCount) {
  if (!palletIncluded || !palletCount) return { avlH: VEH_H, palH: 0 };
  const avlH = VEH_H - PAL_H; // 1단 150mm 고정 차감
  return { avlH, palH: PAL_H };
}

function calcNeedLen(totalVol_m3, palletIncluded, palletCount) {
  const { avlH } = calcPalletInfo(palletIncluded, palletCount);
  if (totalVol_m3 <= 0 || avlH <= 0) return 0;
  return totalVol_m3 / (VEH_W * avlH);
}

function calcPalletVol(palletIncluded, palletCount) {
  if (!palletIncluded || !palletCount) return 0;
  return PAL_L * PAL_W * PAL_H * palletCount;
}

const CHOSEONG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChoseong(s){
  return [...s].map(c=>{
    const code=c.charCodeAt(0)-44032;
    if(code<0||code>11171) return c;
    return CHOSEONG[Math.floor(code/588)];
  }).join('');
}
function matchSearch(name, q){
  if(!q) return true;
  const lq=q.toLowerCase();
  if(name.toLowerCase().includes(lq)) return true;
  if(getChoseong(name).includes(q)) return true;
  return false;
}

window.doLogout = function(){
  curUser=null; curRole=null; orderItems=[]; selectedVehicle=null;
  if(ordersListener) { ordersListener(); ordersListener=null; }
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('mainApp').style.display='none';
};

function buildLoginGrid(){
  const grid=document.getElementById('userGrid');
  grid.innerHTML='';
  USERS.forEach(u=>{
    const btn=document.createElement('button');
    btn.className='user-btn';
    const roleLabel2=u.role==='sales'?'영업팀':u.role==='support'?'생산지원팀':'관리자';
    btn.innerHTML=`<div class="name">${u.name}</div><div class="role">${roleLabel2}</div>`;
    btn.onclick=()=>{
      if(u.role==='admin'){
        // 관리자: PIN 모달
        curUser=u; curRole=u.role;
        document.querySelectorAll('.user-btn').forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        openPinModal();
      } else {
        // 일반 사용자: 바로 로그인
        curUser=u; curRole=u.role;
        document.querySelectorAll('.user-btn').forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        doLogin();
      }
    };
    grid.appendChild(btn);
  });
}

window.openPinModal = function(){
  const m=document.getElementById('pinModal');
  m.style.display='flex';
  document.getElementById('pinInput').value='';
  document.getElementById('pinError').style.display='none';
  setTimeout(()=>document.getElementById('pinInput').focus(),100);
};
window.closePinModal = function(){
  document.getElementById('pinModal').style.display='none';
  curUser=null; curRole=null;
  document.querySelectorAll('.user-btn').forEach(b=>b.classList.remove('selected'));
};
window.checkPin = function(){
  const val=document.getElementById('pinInput').value.trim();
  if(val===adminPin){
    document.getElementById('pinModal').style.display='none';
    doLogin();
  } else {
    document.getElementById('pinError').style.display='block';
    document.getElementById('pinInput').value='';
    document.getElementById('pinInput').focus();
  }
};

(function initLogin(){
  // Firebase에서 사용자 목록 로드 시도
  get(ref(db,'users')).then(snap=>{
    if(snap.val()) USERS=Object.values(snap.val());
    buildLoginGrid();
  }).catch(()=>buildLoginGrid());
  // 저장된 PIN 로드
  get(ref(db,'settings/adminPin')).then(snap=>{ if(snap.val()) adminPin=snap.val(); }).catch(()=>{});
})();

// ===== 탭 전환 =====
window.showTab = function(team, tab){
  currentTab=tab;
  const tabs=document.querySelectorAll('.tab');
  tabs.forEach(t=>t.classList.remove('active'));
  event?.target?.classList?.add('active');
  const c=document.getElementById('mainContent');
  if(team==='sales'){
    if(tab==='reg') renderSalesReg(c);
    else if(tab==='db') renderDBUpload(c);
  } else if(team==='support'){
    if(tab==='list') renderSupportList(c);
    else if(tab==='vehicle') renderVehicleMgmtPage(c);
  } else if(team==='admin'){
    if(tab==='orders') renderAdminOrders(c);
    else if(tab==='db') renderDBUpload(c);
    else if(tab==='users') renderUserMgmt(c);
  }
};

function loadVehicles(){
  get(ref(db,'vehicles')).then(snap=>{
    vehicles=snap.val()||{};
    try{localStorage.setItem('vehicles',JSON.stringify(vehicles));}catch(e){}
  }).catch(()=>{
    try{vehicles=JSON.parse(localStorage.getItem('vehicles')||'{}');}catch(e){vehicles={};}
  });
}

function loadProducts(){
  get(ref(db,'products')).then(snap=>{
    if(snap.val()&&Array.isArray(snap.val())&&snap.val().length>0){
      PRODUCTS=snap.val();
    }
  }).catch(()=>{});
}

let selectedClient = null;

window.onClientSearch = function(){
  const q = document.getElementById('clientSearch').value.trim();
  const dd = document.getElementById('clientDropdown');
  if(!q){ dd.classList.remove('show'); return; }
  const filtered = CLIENTS.filter(name => matchSearch(name, q)).slice(0, 12);
  const showDirect = q.length >= 2 && !filtered.includes(q);
  const items = filtered.map(name =>
    `<div class="dropdown-item" onclick="selectClient('${name}')">${name}</div>`
  );
  if(showDirect) items.push(`<div class="dropdown-item" style="color:var(--blue);" onclick="selectClient('${q}')">✏️ "${q}" 직접 입력</div>`);
  if(!items.length){ dd.innerHTML='<div class="dropdown-item" style="color:var(--gray);">검색 결과 없음</div>'; }
  else { dd.innerHTML = items.join(''); }
  dd.classList.add('show');
};

window.selectClient = function(name){
  selectedClient = name;
  document.getElementById('clientSearch').value = name;
  document.getElementById('clientDropdown').classList.remove('show');
  showClientSelected(name);
};

function showClientSelected(name){
  const el = document.getElementById('clientSelected');
  if(!el) return;
  el.style.display = 'block';
  el.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;background:#eff6ff;border:2px solid #bfdbfe;border-radius:9px;padding:10px 14px;">
    <span style="font-size:15px;font-weight:700;color:#1e40af;">🏭 ${name}</span>
    <button class="btn btn-gray btn-sm" onclick="clearClient()">변경</button>
  </div>`;
}

window.clearClient = function(){
  selectedClient = null;
  document.getElementById('clientSearch').value = '';
  document.getElementById('clientSelected').style.display = 'none';
};

let selectedProdForAdd = null;
window.onProdSearch = function(){
  const q=document.getElementById('prodSearch').value.trim();
  const dd=document.getElementById('prodDropdown');
  if(!q){dd.classList.remove('show');document.getElementById('addForm').style.display='none';return;}
  const filtered=PRODUCTS.filter(p=>matchSearch(p.name,q)).slice(0,15);
  if(!filtered.length){dd.innerHTML='<div class="dropdown-item" style="color:var(--gray);">검색 결과 없음</div>';dd.classList.add('show');return;}
  dd.innerHTML=filtered.map(p=>`<div class="dropdown-item" onclick="selectProd('${p.name.replace(/'/g,"\\'")}')">
    <div>${p.name} <span class="badge ${p.hasCap?'badge-cap':'badge-nocap'}">${p.hasCap?'캡':'캡없음'}</span></div>
    <div class="cat">${p.cat} · ${p.qty}개/박스</div>
  </div>`).join('');
  dd.classList.add('show');
};

window.selectProd = function(name){
  selectedProdForAdd=PRODUCTS.find(p=>p.name===name);
  document.getElementById('prodSearch').value=name;
  document.getElementById('prodDropdown').classList.remove('show');
  document.getElementById('addForm').style.display='block';
  const ca=document.getElementById('capToggleArea');
  if(selectedProdForAdd.hasCap){
    ca.innerHTML=`<div class="cap-toggle-wrap">
      <div class="cap-toggle-label">🧢 캡 포함 여부</div>
      <div class="cap-toggle">
        <button id="capIncBtn" class="active" onclick="setCapMode(true)">캡 포함</button>
        <button id="capExcBtn" onclick="setCapMode(false)">캡 제외</button>
      </div>
    </div>`;
  } else {
    ca.innerHTML='';
  }
};

window.setCapMode = function(inc){
  const incBtn=document.getElementById('capIncBtn');
  const excBtn=document.getElementById('capExcBtn');
  if(incBtn) incBtn.className=inc?'active':'';
  if(excBtn) excBtn.className=!inc?'active':'';
};

window.addItem = function(){
  if(!selectedProdForAdd) return;
  const boxes=parseInt(document.getElementById('boxQty').value)||1;
  const capInc=selectedProdForAdd.hasCap
    ? (document.getElementById('capIncBtn')?.className?.includes('active') ?? true)
    : false;

  let capBoxes=0;
  if(selectedProdForAdd.hasCap && capInc && selectedProdForAdd.capQty>0){
    const totalItems=boxes*selectedProdForAdd.qty;
    capBoxes=Math.ceil(totalItems/selectedProdForAdd.capQty);
  }

  orderItems.push({
    id:genId(),
    name:selectedProdForAdd.name,
    cat:selectedProdForAdd.cat,
    qty:selectedProdForAdd.qty,
    boxes,
    hasCap:selectedProdForAdd.hasCap,
    capName:selectedProdForAdd.capName,
    capQty:selectedProdForAdd.capQty,
    capBoxes,
    capIncluded:capInc,
    bl:selectedProdForAdd.bl,
    bw:selectedProdForAdd.bw,
    bh:selectedProdForAdd.bh,
  });

  document.getElementById('prodSearch').value='';
  document.getElementById('addForm').style.display='none';
  selectedProdForAdd=null;
  renderItemList();
  calcResult();
};

function renderItemList(){
  const list=document.getElementById('itemList');
  const sec=document.getElementById('itemListSection');
  const ss=document.getElementById('sendSection');
  if(!list) return;
  const ms=document.getElementById('memoSection');
  if(!orderItems.length){
    sec.style.display='none';
    if(ms) ms.style.display='none';
    if(ss) ss.style.display='none';
    return;
  }
  sec.style.display='block';
  if(ms) ms.style.display='block';
  if(ss) ss.style.display='block';
  document.getElementById('itemCount').textContent=`(총 ${orderItems.length}항목)`;
  list.innerHTML=orderItems.map((it,i)=>{
    let capText='';
    if(it.hasCap){
      if(it.capIncluded)
        capText=`<div class="product-cap">🧢 ${it.capName} ${it.capBoxes}박스 포함</div>`;
      else
        capText=`<div class="product-cap excluded">🧢 ${it.capName} — 캡 제외</div>`;
    }
    return `<div class="product-item">
      <div class="product-item-header">
        <div class="product-name">${it.name}</div>
        <div class="product-qty">${it.boxes}박스</div>
      </div>
      <div style="font-size:12px;color:var(--gray);">${it.cat} · ${it.qty}개/박스</div>
      ${capText}
      <div class="item-actions">
        <button class="btn btn-gray btn-sm" onclick="editItem(${i})">수정</button>
        <button class="btn btn-red btn-sm" onclick="removeItem(${i})">삭제</button>
      </div>
    </div>`;
  }).join('');
}

window.editItem = function(i){
  const it=orderItems[i];
  const newBoxes=prompt(`[${it.name}] 박스 수량 변경`, it.boxes);
  if(newBoxes===null) return;
  const n=parseInt(newBoxes);
  if(isNaN(n)||n<1){toast('올바른 수량을 입력하세요');return;}
  orderItems[i].boxes=n;
  if(orderItems[i].hasCap && orderItems[i].capIncluded && orderItems[i].capQty>0){
    orderItems[i].capBoxes=Math.ceil(n*orderItems[i].qty/orderItems[i].capQty);
  }
  renderItemList(); calcResult();
};
window.removeItem = function(i){
  orderItems.splice(i,1);
  renderItemList(); calcResult();
};

window.setPalletMode = function(on){
  palletIncluded=on;
  palletCount=on?1:0;
  const yBtn=document.getElementById('palYesBtn');
  const nBtn=document.getElementById('palNoBtn');
  if(yBtn) yBtn.className=on?'btn btn-blue':'btn btn-gray';
  if(nBtn) nBtn.className=on?'btn btn-gray':'btn btn-red';
  calcResult();
};

function calcResult(){
  const ra=document.getElementById('resultArea');
  const ss=document.getElementById('sendSection');
  if(!ra) return;
  if(!orderItems.length){ra.innerHTML='';if(ss)ss.style.display='none';return;}

  const {prodVol, capVol, totalVol} = calcOrderVolume(orderItems);
  const pc = palletIncluded ? palletCount : 0;
  const palInfo = calcPalletInfo(palletIncluded, pc);
  const needLen = calcNeedLen(totalVol, palletIncluded, pc);
  const palNote = palletIncluded ? ' · 파렛트 적재' : '';

  ra.innerHTML=`<div class="section">
    <div class="result-card result-ok" style="text-align:center;">
      <div class="result-title" style="font-size:15px;">📐 필요 적재함 길이</div>
      <div style="font-size:32px;font-weight:800;color:#1e40af;margin:8px 0;">${needLen.toFixed(2)} m 이상</div>
      <div style="font-size:12px;color:#64748b;line-height:1.8;">
        폭 ${VEH_W}m × 높이 ${VEH_H}m 기준${palNote}
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-box">
        <div class="stat-val">${totalVol.toFixed(3)}</div>
        <div class="stat-lbl">제품+캡 부피 (m³)</div>
      </div>
      <div class="stat-box">
        <div class="stat-val">${palletIncluded ? '✅ 적재' : '❌ 미적재'}</div>
        <div class="stat-lbl">파렛트</div>
      </div>
    </div>
    <div style="margin-top:10px;font-size:12px;color:#94a3b8;padding:8px;background:#f8fafc;border-radius:8px;line-height:1.8;">
      📦 제품 박스: ${prodVol.toFixed(3)} m³ &nbsp;|&nbsp; 🧢 캡 박스: ${capVol.toFixed(3)} m³
    </div>
  </div>`;

  if(ss) ss.style.display='block';
}

// 출고 등록 & 알림
window.sendOrder = function(){
  if(!orderItems.length){toast('출고 항목을 추가하세요');return;}
  if(!selectedClient){toast('납품처를 먼저 선택해주세요');return;}
  const orderId=genId();
  const orderData={
    id:orderId, time:nowStr(),
    user:curUser.name,
    client:selectedClient,
    items:orderItems,
    memo:(document.getElementById('orderMemo')?.value||'').trim(),
    palletIncluded:palletIncluded,
    palletCount:palletIncluded?palletCount:0,
    status:'new',
    createdAt:Date.now()
  };
  set(ref(db,`orders/${orderId}`),orderData).then(()=>{
    // 지원팀 전원 수신자로 자동 설정
    const supporters = USERS.filter(u => u.role === 'support' && u.phone);

    // 문자 본문 구성
    const memo = document.getElementById('orderMemo')?.value?.trim();
    let smsBody = `[출고등록]\n`;
    smsBody += `등록자: ${curUser.name}\n`;
    smsBody += `납품처: ${selectedClient}\n`;
    if(memo) smsBody += `전달: ${memo}\n`;
    smsBody += `일시: ${nowStr()}`;

    if(supporters.length > 0){
      const phones = supporters.map(u => u.phone).join(';');
      window.location.href = `sms:${phones}?body=${encodeURIComponent(smsBody)}`;
    } else {
      toast('⚠️ 지원팀 연락처가 없습니다. 사용자 관리에서 등록해주세요.');
    }
    toast('✅ 출고 등록 완료!');
    orderItems=[]; selectedClient=null;
    renderSalesReg(document.getElementById('mainContent'));
  }).catch(()=>toast('❌ 저장 실패, 다시 시도해주세요'));
};

window.uploadDB = function(input){
  const f=input.files[0];
  if(!f) return;
  const statusEl=document.getElementById('uploadStatus');
  const previewEl=document.getElementById('uploadPreview');
  statusEl.innerHTML='<span style="color:var(--blue);">⏳ 파일 읽는 중...</span>';

  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});

      // 헤더: Row2(index2)가 컬럼명, Row3(index3)부터 데이터
      // 카테고리 구분 행(▶) 및 빈 행 제외
      const newProducts=[];
      for(let i=3;i<rows.length;i++){
        const r=rows[i];
        const hasCap=String(r[5]||'').trim();
        if(hasCap!=='Y'&&hasCap!=='N') continue; // 카테고리 행/빈행 skip
        const cat=String(r[0]||'').trim();
        const name=String(r[1]||'').trim();
        if(!name) continue;
        newProducts.push({
          cat, name,
          qty:Number(r[2])||0,
          capName:String(r[3]||'').trim(),
          capQty:Number(r[4])||0,
          hasCap:hasCap==='Y',
          bl:Number(r[6])||0,
          bw:Number(r[7])||0,
          bh:Number(r[8])||0,
        });
      }

      if(!newProducts.length){
        statusEl.innerHTML='<span style="color:var(--red);">❌ 데이터를 읽지 못했습니다. 파일 형식을 확인하세요.</span>';
        return;
      }

      // Firebase에 저장 + 로컬 업데이트
      set(ref(db,'products'),newProducts).then(()=>{
        PRODUCTS=newProducts;
        statusEl.innerHTML=`<span style="color:var(--green);">✅ 업데이트 완료! ${newProducts.length}개 제품 반영됨</span>`;
        previewEl.innerHTML=`<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:9px;padding:12px;font-size:13px;">
          ${newProducts.slice(0,5).map(p=>`<div>· ${p.cat} | ${p.name} | ${p.qty}개/박스</div>`).join('')}
          ${newProducts.length>5?`<div style="color:var(--gray);">... 외 ${newProducts.length-5}개</div>`:''}
        </div>`;
        document.getElementById('prodCount').textContent=newProducts.length;
        toast('✅ 제품 DB 업데이트 완료!');
      }).catch(()=>{
        // Firebase 저장 실패해도 로컬은 업데이트
        PRODUCTS=newProducts;
        statusEl.innerHTML=`<span style="color:var(--orange);">⚠️ 로컬 업데이트 완료 (${newProducts.length}개), Firebase 저장 실패</span>`;
        toast('제품 DB 로컬 업데이트 완료');
      });

    } catch(err){
      statusEl.innerHTML=`<span style="color:var(--red);">❌ 파일 파싱 오류: ${err.message}</span>`;
    }
  };
  reader.onerror=()=>{ statusEl.innerHTML='<span style="color:var(--red);">❌ 파일 읽기 실패</span>'; };
  reader.readAsArrayBuffer(f);
};

function renderOrderCard(o){

    let capStr='';
    if(it.hasCap) capStr=it.capIncluded?` / 캡 ${it.capBoxes}박스`:' / 캡 제외';
    return `<div class="order-product-row"><span>${it.name}</span><span>${it.boxes}박스${capStr}</span></div>`;
  }).join('');
  const actionBtns=o.status!=='done'
    ?`<button class="btn btn-green btn-sm" onclick="confirmOrder('${o.id}')">✅ 확인완료</button>`
    :`<button class="btn btn-blue btn-sm" onclick="openOrderDetail('${o.id}')">📋 상세보기</button>
      <button class="btn btn-red btn-sm" onclick="deleteOrder('${o.id}')">🗑️ 삭제</button>`;
  return `<div class="order-card" id="order_${o.id}">
    <div class="order-header">
      <span class="order-id">📋 ${o.user} · ${o.time}</span>
      <span class="order-status ${statusCls}">${statusTxt}</span>
    </div>
    ${clientHtml}
    ${memoCardHtml}
    <div class="order-products">${itemsHtml}</div>
    <div class="order-actions no-print">
      ${actionBtns}
      <button class="btn btn-gray btn-sm" onclick="printOrder('${o.id}')">🖨️ 인쇄</button>
    </div>
  </div>`;
}

window.saveUser = function(){
  const name=(document.getElementById('uName').value||'').trim();
  const phone=(document.getElementById('uPhone').value||'').trim();
  const role=document.getElementById('uRole').value;
  if(!name){toast('이름을 입력하세요');return;}
  const id='u'+Date.now().toString(36);
  const existing=USERS.find(u=>u.name===name&&u.role!=='admin');
  const uid=existing?existing.id:id;
  const uData={id:uid,name,role,phone};
  const idx=USERS.findIndex(u=>u.id===uid);
  if(idx>=0) USERS[idx]=uData; else USERS.push(uData);
  const saveObj={};
  USERS.forEach(u=>{ saveObj[u.id]=u; });
  set(ref(db,'users'),saveObj).then(()=>{
    toast('✅ 사용자 저장 완료');
    buildLoginGrid();
    renderUserMgmt(document.getElementById('mainContent'));
  }).catch(()=>toast('❌ 저장 실패'));
};

function renderVehicleList(list){
  if(!list||!list.length) return '<div class="empty-msg">등록된 차량 없음</div>';
  return list.map(v=>`<div class="vehicle-card" style="display:flex;justify-content:space-between;align-items:center;padding:12px;margin-bottom:8px;background:#f8fafc;border-radius:10px;border:1px solid var(--border);">
    <div>
      <div style="font-weight:700;font-size:15px;">🚛 ${v.num}</div>
      <div style="font-size:12px;color:#64748b;margin-top:2px;">길이 ${v.len}m · 폭 ${v.wid||2.4}m · 높이 ${v.ht||2.5}m</div>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="btn btn-gray btn-sm" onclick="editVehicleNew('${v.num}')">✏️ 수정</button>
      <button class="btn btn-red btn-sm" onclick="deleteVehicleNew('${v.num}')">🗑️</button>
    </div>
  </div>`).join('');
}

window.saveVehicleNew = function(){
  const num=(document.getElementById('vNum').value||'').trim();
  const len=parseFloat(document.getElementById('vLen').value);
  const wid=parseFloat(document.getElementById('vWid').value)||2.4;
  const ht=parseFloat(document.getElementById('vHt').value)||2.5;
  if(!num){toast('차량번호를 입력하세요');return;}
  if(!len||len<1){toast('길이를 올바르게 입력하세요');return;}
  vehicles[num]={num,len,wid,ht};
  set(ref(db,'vehicles/'+num),{num,len,wid,ht}).then(()=>{
    toast('✅ 저장 완료');
    try{localStorage.setItem('vehicles',JSON.stringify(vehicles));}catch(e){}
    renderVehicleMgmtPage(document.getElementById('mainContent'));
  }).catch(()=>toast('❌ 저장 실패'));
};

window.editVehicleNew = function(num){
  const v=vehicles[num];
  if(!v) return;
  document.getElementById('vNum').value=v.num;
  document.getElementById('vLen').value=v.len;
  document.getElementById('vWid').value=v.wid||2.4;
  document.getElementById('vHt').value=v.ht||2.5;
  document.getElementById('vNum').focus();
  toast('수정 후 저장 버튼을 누르세요');
};

window.deleteVehicleNew = function(num){
  if(!confirm(num+' 차량을 삭제하시겠습니까?')) return;
  delete vehicles[num];
  remove(ref(db,'vehicles/'+num)).then(()=>{
    toast('🗑️ 삭제 완료');
    try{localStorage.setItem('vehicles',JSON.stringify(vehicles));}catch(e){}
    renderVehicleMgmtPage(document.getElementById('mainContent'));
  }).catch(()=>toast('❌ 삭제 실패'));
};

window.searchVehicleNew = function(q){
  const el=document.getElementById('vehSearchResult2');
  const allEl=document.getElementById('allVehiclesList');
  if(!q){if(el)el.innerHTML='';if(allEl)allEl.innerHTML=renderVehicleList(Object.values(vehicles));return;}
  const found=Object.values(vehicles).filter(v=>v.num&&v.num.includes(q));
  if(allEl) allEl.innerHTML='';
  if(el) el.innerHTML=renderVehicleList(found);
};

function roleLabel(r){return r==='sales'?'영업팀':r==='support'?'생산지원팀':'관리자';}
window.doLogin = function(){
  if(!curUser) return;
  document.getElementById('loginScreen').style.display='none';
  const m=document.getElementById('mainApp');
  m.style.display='flex';
  document.getElementById('headerUser').textContent=curUser.name+' ('+roleLabel(curRole)+')';
  document.getElementById('salesTabs').style.display=curRole==='sales'?'flex':'none';
  document.getElementById('supportTabs').style.display=curRole==='support'?'flex':'none';
  document.getElementById('adminTabs').style.display=curRole==='admin'?'flex':'none';
  loadVehicles();
  loadProducts();
  if(curRole==='sales') showTab('sales','reg');
  else if(curRole==='support') showTab('support','list');
  else showTab('admin','orders');
};

</script>
