<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>출고 적재 계산기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:15px;}
:root{--blue:#2563eb;--green:#16a34a;--red:#dc2626;--orange:#ea580c;--gray:#6b7280;--light:#f8fafc;--border:#e2e8f0;}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* 로그인 */
#loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:30px 20px;background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);}
.login-logo{font-size:42px;margin-bottom:8px;}
.login-title{color:#fff;font-size:22px;font-weight:700;margin-bottom:4px;}
.login-sub{color:#bfdbfe;font-size:13px;margin-bottom:32px;}
.login-card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,0.2);}
.login-label{font-size:13px;color:var(--gray);font-weight:600;margin-bottom:8px;display:block;}
.user-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.user-btn{padding:12px 8px;border:2px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;text-align:center;transition:all .15s;}
.user-btn:hover{border-color:var(--blue);background:#eff6ff;}
.user-btn.selected{border-color:var(--blue);background:#eff6ff;}
.user-btn .name{font-size:14px;font-weight:600;color:#1a1a2e;}
.user-btn .role{font-size:11px;color:var(--gray);margin-top:2px;}
.login-go{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;}
.login-go:disabled{background:#94a3b8;cursor:not-allowed;}

/* 헤더 */
.header{background:var(--blue);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.header-title{font-size:17px;font-weight:700;}
.header-user{font-size:12px;opacity:.85;}
.logout-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;}

/* 탭 */
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:52px;z-index:90;}
.tab{flex:1;padding:12px 4px;border:none;background:none;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}

/* 콘텐츠 */
.content{flex:1;padding:16px;overflow-y:auto;}
.section{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.section-title{font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:12px;display:flex;align-items:center;gap:6px;}

/* 검색 */
.search-wrap{position:relative;margin-bottom:10px;}
.search-input{width:100%;padding:12px 14px 12px 40px;border:2px solid var(--border);border-radius:10px;font-size:15px;outline:none;}
.search-input:focus{border-color:var(--blue);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--gray);}
.dropdown{background:#fff;border:2px solid var(--border);border-radius:10px;max-height:220px;overflow-y:auto;margin-bottom:8px;display:none;}
.dropdown.show{display:block;}
.dropdown-item{padding:11px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:14px;}
.dropdown-item:last-child{border-bottom:none;}
.dropdown-item:hover{background:#eff6ff;}
.dropdown-item .cat{font-size:11px;color:var(--gray);}

/* 입력 */
.input-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.input-label{font-size:13px;color:var(--gray);white-space:nowrap;min-width:60px;}
input[type=number],input[type=text]{flex:1;padding:10px 12px;border:2px solid var(--border);border-radius:8px;font-size:15px;outline:none;}
input:focus{border-color:var(--blue);}
.btn{padding:11px 16px;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-gray{background:#e5e7eb;color:#374151;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:7px;}
.btn:active{transform:scale(.97);}

/* 캡 토글 */
.cap-toggle-wrap{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fefce8;border:2px solid #fde047;border-radius:9px;margin-bottom:10px;}
.cap-toggle-label{font-size:13px;font-weight:600;color:#713f12;flex:1;}
.cap-toggle{display:flex;border:2px solid #d97706;border-radius:7px;overflow:hidden;}
.cap-toggle button{padding:6px 14px;border:none;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#92400e;}
.cap-toggle button.active{background:#d97706;color:#fff;}

/* 목록 */
.product-list{display:flex;flex-direction:column;gap:8px;}
.product-item{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px;}
.product-item-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.product-name{font-size:14px;font-weight:700;}
.product-qty{font-size:13px;color:var(--blue);font-weight:600;}
.product-cap{font-size:12px;color:var(--gray);margin-top:3px;}
.product-cap.excluded{color:var(--orange);text-decoration:line-through;}
.item-actions{display:flex;gap:5px;margin-top:8px;}

/* 적재 결과 */
.result-card{border-radius:12px;padding:16px;margin-bottom:12px;text-align:center;}
.result-ok{background:#dcfce7;border:2px solid #86efac;}
.result-warn{background:#fef3c7;border:2px solid #fcd34d;}
.result-over{background:#fee2e2;border:2px solid #fca5a5;}
.result-title{font-size:18px;font-weight:800;margin-bottom:4px;}
.result-sub{font-size:13px;color:var(--gray);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.stat-box{background:#f8fafc;border-radius:10px;padding:12px;text-align:center;}
.stat-val{font-size:22px;font-weight:800;color:var(--blue);}
.stat-lbl{font-size:11px;color:var(--gray);margin-top:2px;}

/* 차량 */
.vehicle-info{background:#eff6ff;border-radius:10px;padding:12px;margin-bottom:12px;}
.vehicle-title{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:6px;}
.vehicle-detail{font-size:13px;color:#1e40af;}

/* 파렛트 */
.pallet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.pallet-btn{padding:10px;border:2px solid var(--border);border-radius:9px;background:#fff;cursor:pointer;text-align:center;font-size:13px;font-weight:600;transition:all .15s;}
.pallet-btn.selected{border-color:var(--green);background:#f0fdf4;color:var(--green);}
.pallet-count-row{display:flex;align-items:center;gap:10px;}
.pallet-count-row input{width:80px;flex:none;}

/* 지원팀 목록 */
.order-card{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.order-id{font-size:12px;color:var(--gray);}
.order-time{font-size:12px;color:var(--gray);}
.order-status{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;}
.status-new{background:#fef3c7;color:#92400e;}
.status-done{background:#dcfce7;color:#166534;}
.order-products{margin:6px 0;}
.order-product-row{font-size:13px;padding:4px 0;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;}
.order-product-row:last-child{border-bottom:none;}
.order-vehicle{font-size:13px;color:#1e40af;margin-top:6px;padding:6px 10px;background:#eff6ff;border-radius:7px;}
.order-actions{display:flex;gap:6px;margin-top:10px;}

/* 인쇄 버튼 */
.print-btn{background:#7c3aed;color:#fff;border:none;padding:11px 16px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;width:100%;justify-content:center;margin-top:10px;}

/* 알림 */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:12px 22px;border-radius:25px;font-size:14px;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

/* DB 업로드 탭 */
.upload-area{border:3px dashed var(--border);border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:all .2s;}
.upload-area:hover{border-color:var(--blue);background:#eff6ff;}
.upload-icon{font-size:40px;margin-bottom:10px;}
.upload-text{font-size:15px;font-weight:600;color:var(--gray);}
.upload-sub{font-size:12px;color:#94a3b8;margin-top:4px;}

/* 차량 관리 */
.vehicle-card{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;}
.vehicle-num{font-size:18px;font-weight:800;color:var(--blue);}
.vehicle-meta{font-size:13px;color:var(--gray);margin-top:3px;}

/* 인쇄 스타일 */
@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { position: fixed; top: 0; left: 0; width: 100%; padding: 20px; }
  .no-print { display: none !important; }
}

/* 공통 */
.empty-msg{text-align:center;color:var(--gray);padding:30px;font-size:14px;}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;}
.badge-cap{background:#fef3c7;color:#92400e;}
.badge-nocap{background:#f3f4f6;color:#6b7280;}
.divider{height:1px;background:var(--border);margin:12px 0;}
</style>
</head>

const CHOSEONG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChoseong(s){
  return [...s].map(c=>{
    const code=c.charCodeAt(0)-44032;
    if(code<0||code>11171) return c;
    return CHOSEONG[Math.floor(code/588)];
  }).join('');
}
function matchSearch(name, q){
  if(!q) return true;
  const lq=q.toLowerCase();
  if(name.toLowerCase().includes(lq)) return true;
  if(getChoseong(name).includes(q)) return true;
  return false;
}

window.showTab = function(team, tab){
  currentTab=tab;
  const tabs=document.querySelectorAll('.tab');
  tabs.forEach(t=>t.classList.remove('active'));
  event?.target?.classList?.add('active');
  const c=document.getElementById('mainContent');
  if(team==='sales'){
    if(tab==='reg') renderSalesReg(c);
    else if(tab==='db') renderDBUpload(c);
  } else {
    if(tab==='list') renderSupportList(c);
    else if(tab==='vehicle') renderVehicleSearch(c);
  }
};

function loadVehicles(){
  get(ref(db,'vehicles')).then(snap=>{
    vehicles=snap.val()||{};
    try{localStorage.setItem('vehicles',JSON.stringify(vehicles));}catch(e){}
  }).catch(()=>{
    try{vehicles=JSON.parse(localStorage.getItem('vehicles')||'{}');}catch(e){vehicles={};}
  });
}

window.onClientSearch = function(){

  const filtered = CLIENTS.filter(name => matchSearch(name, q)).slice(0, 12);
  // 직접 입력한 텍스트도 옵션으로 추가
  const showDirect = q.length >= 2 && !filtered.includes(q);
  const items = filtered.map(name =>

window.addItem = function(){
  if(!selectedProdForAdd) return;
  const boxes=parseInt(document.getElementById('boxQty').value)||1;
  const capIncluded=selectedProdForAdd.hasCap ? !document.getElementById('capExcBtn')?.className?.includes('active') : false;
  // 실제로는 capIncBtn이 active이면 포함
  const capInc=selectedProdForAdd.hasCap
    ? (document.getElementById('capIncBtn')?.className?.includes('active'))
    : false;

  // 캡 박스 수량 계산 (제품 수량 기준)
  let capBoxes=0;
  if(selectedProdForAdd.hasCap && capInc && selectedProdForAdd.capQty>0){
    const totalItems=boxes*selectedProdForAdd.qty;
    capBoxes=Math.ceil(totalItems/selectedProdForAdd.capQty);
  }

  orderItems.push({
    id:genId(),
    name:selectedProdForAdd.name,
    cat:selectedProdForAdd.cat,
    qty:selectedProdForAdd.qty,
    boxes,
    hasCap:selectedProdForAdd.hasCap,
    capName:selectedProdForAdd.capName,
    capQty:selectedProdForAdd.capQty,
    capBoxes,
    capIncluded:capInc,
    bl:selectedProdForAdd.bl,
    bw:selectedProdForAdd.bw,
    bh:selectedProdForAdd.bh,
  });

  document.getElementById('prodSearch').value='';

  const n=parseInt(newBoxes);
  if(isNaN(n)||n<1){toast('올바른 수량을 입력하세요');return;}
  orderItems[i].boxes=n;
  if(orderItems[i].hasCap && orderItems[i].capIncluded && orderItems[i].capQty>0){
    orderItems[i].capBoxes=Math.ceil(n*orderItems[i].qty/orderItems[i].capQty);

// 적재 계산
function calcResult(){
  const ra=document.getElementById('resultArea');
  const ss=document.getElementById('sendSection');
  if(!ra) return;
  if(!orderItems.length){ra.innerHTML='';if(ss)ss.style.display='none';return;}

  // 부피 계산 (mm³ → cm³)
  let totalVol=0;
  const details=[];
  orderItems.forEach(it=>{
    let prodVol=0;
    if(it.bl&&it.bw&&it.bh) prodVol=it.bl*it.bw*it.bh*it.boxes/1e6;
    let capVol=0;
    if(it.capIncluded && it.capBoxes>0 && it.capName){
      const cb=CAP_BOXES[it.capName]||CAP_BOXES[it.capName.trim()];
      if(cb) capVol=cb.l*cb.w*cb.h*it.capBoxes/1e6;
    }
    totalVol+=prodVol+capVol;
    details.push({name:it.name,prodVol,capVol,capBoxes:it.capBoxes,capIncluded:it.capIncluded});
  });

  const palH=selectedPallet&&selectedPallet.l?selectedPallet.h*palletCount:0;

  if(!selectedVehicle){
    // 차량 미선택 시: 필요 적재 길이만 계산 (폭2.4m, 높이2.5m 고정)
    const avlHt_cm=VEH_H_CM-(palH/10);
    const needLen=totalVol/(VEH_W_CM*avlHt_cm/1e4);
    ra.innerHTML=`<div class="section">
      <div class="result-card result-ok" style="text-align:center;">
        <div class="result-title" style="font-size:15px;">📐 필요 적재함 길이</div>
        <div style="font-size:28px;font-weight:800;color:#1e40af;margin:8px 0;">${needLen.toFixed(2)} m 이상</div>
        <div style="font-size:12px;color:#64748b;">폭 2.4m · 높이 2.5m 기준${palH?` · 파렛트 ${palH/10}cm×${palletCount}개`:'(파렛트 제외)'}</div>
      </div>
    </div>`;
    if(ss) ss.style.display='block';
    return;
  }

  const truck=selectedVehicle;
  const tLen=truck.len*10, tWid=VEH_W_CM, tHt=VEH_H_CM;
  const avlHt=tHt-(palH/10);
  const truckVol=tLen*tWid*avlHt/1e4;
  const needLen2=totalVol/(tWid*avlHt/1e4);

  const remain=truckVol-totalVol;
  const pct=Math.min(100,Math.round(totalVol/truckVol*100));

  const statusClass=remain>=0?(pct<85?'result-ok':'result-warn'):'result-over';
  const statusText=remain>=0?(pct<85?'✅ 적재 가능':'⚠️ 거의 가득'):'🚨 초과';

  ra.innerHTML=`<div class="section">
    <div class="result-card ${statusClass}">
      <div class="result-title">${statusText}</div>
      <div class="result-sub">적재율 ${pct}% · ${remain>=0?'+':''}${fmtNum(Math.round(remain))} cm³ ${remain>=0?'여유':'초과'}</div>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val">${fmtNum(Math.round(totalVol))}</div><div class="stat-lbl">사용 부피 (cm³)</div></div>
      <div class="stat-box"><div class="stat-val">${fmtNum(Math.round(truckVol))}</div><div class="stat-lbl">차량 적재공간 (cm³)</div></div>
    </div>
    <div style="margin-top:10px;background:#eff6ff;border-radius:8px;padding:10px;font-size:13px;">
      🚛 차량 ${truck.num||''} · 길이 ${truck.len}m × 폭 ${VEH_W_CM/100}m × 높이 ${VEH_H_CM/100}m<br>
      📐 필요 적재함 길이: <strong>${needLen2.toFixed(2)}m 이상</strong>${palH?` · 파렛트 ${palH/10}cm×${palletCount}개`:''}
    </div>
  </div>`;

  if(ss) ss.style.display='block';
}

window.sendOrder = function(){
  if(!orderItems.length){toast('출고 항목을 추가하세요');return;}
  if(!selectedClient){toast('납품처를 먼저 선택해주세요');return;}
  const orderId=genId();
  const orderData={
    id:orderId, time:nowStr(),
    user:curUser.name,
    client:selectedClient,
    items:orderItems,
    status:'new',
    createdAt:Date.now()
  };
  set(ref(db,`orders/${orderId}`),orderData).then(()=>{
    // ★ 테스트모드: 나에게만 발송 (완료후 supporters=USERS.filter(...)로 원복)
    const supporters=[{phone:'010-5516-6181'}];
    let smsBody=`[출고등록]\n등록자:${curUser.name}\n납품처:${selectedClient}\n`;
    smsBody+=orderItems.map(it=>{
      let s=`· ${it.name} ${it.boxes}박스`;
      if(it.hasCap) s+=it.capIncluded?` (캡 ${it.capBoxes}박스)`:' (캡 제외)';
      return s;
    }).join('\n');
    smsBody+=`\n시간:${nowStr()}`;
    const phones=supporters.map(s=>s.phone).join(',');
    window.location.href=`sms:${phones}?body=${encodeURIComponent(smsBody)}`;
    toast('✅ 출고 등록 완료!');
    orderItems=[];selectedClient=null;
    renderSalesReg(document.getElementById('mainContent'));
  }).catch(()=>toast('❌ 저장 실패, 다시 시도해주세요'));
};

  <div class="section-title" style="margin-top:8px;">📐 적재함 크기 (cm)</div>
  <div class="input-row">
    <span class="input-label">길이</span><input type="number" id="vLen" placeholder="길이">
    <span class="input-label" style="margin-left:4px;">폭</span><input type="number" id="vWid" placeholder="폭">
    <span class="input-label" style="margin-left:4px;">높이</span><input type="number" id="vHt" placeholder="높이">
  </div>
  <button class="btn btn-blue" style="width:100%;" onclick="saveVehicle()">💾 차량 저장</button>
</div>
<div class="section">
  <div class="section-title">🚛 등록된 차량 (${list.length}대)</div>
  ${list.length?list.map(v=>`<div class="vehicle-card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div><div class="vehicle-num">${v.num}</div><div class="vehicle-meta">${v.driver||''} · ${v.phone||''}</div>
      <div class="vehicle-meta">${v.len}×${v.wid}×${v.ht} cm</div></div>
      <button class="btn btn-red btn-sm" onclick="deleteVehicle('${v.id}')">삭제</button>
    </div>
  </div>`).join(''):'<div class="empty-msg">등록된 차량이 없습니다</div>'}
</div>`;

window.saveVehicle = function(){
  const num=document.getElementById('vNum').value.trim();
  if(num.length!==4){toast('차량번호 4자리를 입력하세요');return;}
  const vData={
    id:genId(), num,
    driver:document.getElementById('vDriver').value.trim(),
    phone:document.getElementById('vPhone').value.trim(),
    len:+document.getElementById('vLen').value||0,
    wid:+document.getElementById('vWid').value||0,
    ht:+document.getElementById('vHt').value||0,
  };
  // 기존 동일번호 덮어쓰기
  const existing=Object.entries(vehicles).find(([k,v])=>v.num===num);
  const key=existing?existing[0]:vData.id;
  vData.id=key;
  update(ref(db,'vehicles'),{[key]:vData}).then(()=>{
    vehicles[key]=vData;
    try{localStorage.setItem('vehicles',JSON.stringify(vehicles));}catch(e){}
    toast('✅ 차량 저장 완료');
    renderVehicleMgmt(document.getElementById('mainContent'));
  }).catch(()=>toast('❌ 저장 실패'));
};

window.deleteVehicle = function(id){
  if(!confirm('차량을 삭제할까요?')) return;
  set(ref(db,`vehicles/${id}`),null).then(()=>{
    delete vehicles[id];
    try{localStorage.setItem('vehicles',JSON.stringify(vehicles));}catch(e){}
    renderVehicleMgmt(document.getElementById('mainContent'));
  });
};

  setTimeout(()=>{

// ===== 지원팀: 출고내역 =====
function renderSupportList(c){
  c.innerHTML=`<div id="ordersList"><div class="empty-msg">로딩 중...</div></div>`;
  if(ordersListener) ordersListener();
  ordersListener=onValue(ref(db,'orders'),snap=>{
    const data=snap.val()||{};
    const orders=Object.values(data).sort((a,b)=>b.createdAt-a.createdAt);
    const ol=document.getElementById('ordersList');
    if(!ol) return;
    if(!orders.length){ol.innerHTML='<div class="empty-msg">출고 내역이 없습니다</div>';return;}
    ol.innerHTML=orders.map(o=>renderOrderCard(o)).join('');
  });
}

function renderOrderCard(o){
  const statusCls=o.status==='done'?'status-done':'status-new';
  const statusTxt=o.status==='done'?'✅ 확인완료':'🆕 신규';
  const clientHtml=o.client?`<div style="font-size:14px;font-weight:700;color:#1e40af;margin-bottom:6px;">🏭 납품처: ${o.client}</div>`:'';
  const itemsHtml=(o.items||[]).map(it=>{
    let capStr='';
    if(it.hasCap) capStr=it.capIncluded?` / 캡 ${it.capBoxes}박스`:' / 캡 제외';
    return `<div class="order-product-row"><span>${it.name}</span><span>${it.boxes}박스${capStr}</span></div>`;
  }).join('');
  // 지원팀: 수량 수정 불가 → 조회만
  const actionBtns=o.status!=='done'
    ?`<button class="btn btn-green btn-sm" onclick="confirmOrder('${o.id}')">✅ 확인완료</button>`
    :`<button class="btn btn-blue btn-sm" onclick="openOrderDetail('${o.id}')">📋 상세보기</button>
      <button class="btn btn-red btn-sm" onclick="deleteOrder('${o.id}')">🗑️ 삭제</button>`;
  return `<div class="order-card" id="order_${o.id}">
    <div class="order-header">
      <span class="order-id">📋 ${o.user} · ${o.time}</span>
      <span class="order-status ${statusCls}">${statusTxt}</span>
    </div>
    ${clientHtml}
    <div class="order-products">${itemsHtml}</div>
    <div class="order-actions no-print">
      ${actionBtns}
      <button class="btn btn-gray btn-sm" onclick="printOrder('${o.id}')">🖨️ 인쇄</button>
    </div>
  </div>`;
}

window.confirmOrder = function(id){
  if(!confirm('확인완료 처리하시겠습니까?')) return;
  update(ref(db,`orders/${id}`),{status:'done'}).then(()=>{
    toast('✅ 확인완료 처리');
    setTimeout(()=>openOrderDetail(id),300);
  });
};

// ===== 3번 수정: 인쇄 기능 =====
// ===== 상세보기 모달 =====
window.openOrderDetail = function(id){
  get(ref(db,`orders/${id}`)).then(snap=>{
    const o=snap.val();
    if(!o){toast('데이터를 찾을 수 없습니다');return;}

    // 제품 부피 계산
    let totalVol=0;
    (o.items||[]).forEach(it=>{
      if(it.bl&&it.bw&&it.bh) totalVol+=it.bl*it.bw*it.bh*it.boxes/1e6;
      if(it.capIncluded&&it.capBoxes>0&&it.capName){
        const cb=CAP_BOXES[it.capName]||CAP_BOXES[(it.capName||'').trim()];
        if(cb) totalVol+=cb.l*cb.w*cb.h*it.capBoxes/1e6;
      }
    });

    const palH_mm=o.pallet?(o.pallet.h*(o.pallet.count||1)):0;
    const palH_cm=palH_mm/10;
    const avlHt=VEH_H_CM-palH_cm;
    const needLen=totalVol>0?(totalVol/(VEH_W_CM*avlHt/1e4)).toFixed(2):'0.00';

    const veh=o.vehicle;
    let loadHtml='';
    if(veh&&veh.len){
      const truckVol=veh.len*10*VEH_W_CM*avlHt/1e4;
      const pct=Math.min(100,Math.round(totalVol/truckVol*100));
      const remain=truckVol-totalVol;
      const stCls=remain>=0?(pct<85?'result-ok':'result-warn'):'result-over';
      const stTxt=remain>=0?(pct<85?'✅ 적재 가능':'⚠️ 거의 가득'):'🚨 초과';
      loadHtml=`<div class="result-card ${stCls}" style="margin:12px 0;">
        <div class="result-title">${stTxt}</div>
        <div class="result-sub">적재율 ${pct}% · ${remain>=0?'+':''}${Math.round(remain).toLocaleString()} cm³ ${remain>=0?'여유':'초과'}</div>
        <div style="font-size:12px;margin-top:4px;opacity:.8">🚛 차량 ${veh.num||''} · 길이 ${veh.len}m × 폭 2.4m × 높이 2.5m${palH_mm?` · 파렛트 ${palH_mm}mm×${o.pallet.count}개`:''}</div>
        <div style="font-size:13px;margin-top:6px;background:rgba(255,255,255,.4);border-radius:6px;padding:6px;font-weight:600;">📐 필요 적재함 길이: ${needLen}m 이상</div>
      </div>`;
    } else {
      loadHtml=`<div class="result-card result-ok" style="margin:12px 0;text-align:center;">
        <div class="result-title" style="font-size:14px;">📐 필요 적재함 길이</div>
        <div style="font-size:24px;font-weight:800;color:#1e40af;">${needLen}m 이상</div>
        <div style="font-size:12px;color:#64748b;">폭 2.4m · 높이 2.5m 기준${palH_cm?` · 파렛트 ${palH_cm}cm×${o.pallet?.count||1}개`:''}</div>
      </div>`;
    }

    const itemsHtml=(o.items||[]).map(it=>{
      let capStr='';
      if(it.hasCap) capStr=it.capIncluded
        ?`<span style="color:#b45309"> / 캡 ${it.capBoxes}박스</span>`
        :`<span style="color:#9ca3af"> / 캡 제외</span>`;
      return `<div class="order-product-row" style="padding:8px 0;border-bottom:1px solid #f1f5f9;">
        <span style="font-weight:600">${it.name}</span>
        <span>${it.boxes}박스${capStr}</span>
      </div>`;
    }).join('');

    const overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center;';
    overlay.innerHTML=`<div style="background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;max-height:85vh;overflow-y:auto;padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="font-size:16px;font-weight:700;">📋 출고 상세</div>
        <button onclick="this.closest('div[style*=fixed]').remove()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#6b7280;">✕</button>
      </div>
      <div style="font-size:13px;color:#64748b;margin-bottom:8px;">${o.user} · ${o.time}</div>
      ${o.client?`<div style="font-size:15px;font-weight:700;color:#1e40af;margin-bottom:8px;">🏭 ${o.client}</div>`:''}
      ${loadHtml}
      <div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;">📦 제품 목록</div>
      ${itemsHtml}
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="btn btn-gray" style="flex:1" onclick="this.closest('div[style*=fixed]').remove()">닫기</button>
        <button class="btn btn-blue" style="flex:1" onclick="printOrder('${o.id}');this.closest('div[style*=fixed]').remove()">🖨️ 인쇄</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
  });
};

// ===== 삭제 기능 =====
window.deleteOrder = function(id){
  if(!confirm('이 출고 내역을 삭제하시겠습니까?')) return;
  remove(ref(db,`orders/${id}`)).then(()=>toast('🗑️ 삭제되었습니다')).catch(()=>toast('❌ 삭제 실패'));
};

window.printOrder = function(orderId){
  get(ref(db,`orders/${orderId}`)).then(snap=>{
    const o=snap.val();
    if(!o){toast('주문 정보를 찾을 수 없습니다');return;}

    const itemsRows=(o.items||[]).map(it=>{
      let capStr='';
      if(it.hasCap) capStr=it.capIncluded?`캡 포함 (${it.capBoxes}박스)`:'캡 제외';
      else capStr='-';
      return `<tr>
        <td>${it.cat}</td>
        <td style="font-weight:bold;">${it.name}</td>
        <td style="text-align:center;">${it.boxes}박스</td>
        <td style="text-align:center;">${it.qty}개/박스</td>
        <td style="text-align:center;">${capStr}</td>
      </tr>`;
    }).join('');

    const clientInfo = o.client || '-';

    const printHTML=`
      <style>
        body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:13px;color:#000;}
        h2{font-size:18px;text-align:center;margin-bottom:4px;}
        .meta{font-size:12px;color:#555;text-align:center;margin-bottom:12px;}
        table{width:100%;border-collapse:collapse;margin-top:8px;}
        th{background:#2563eb;color:#fff;padding:8px;font-size:12px;}
        td{border:1px solid #ddd;padding:7px 8px;font-size:13px;}
        tr:nth-child(even) td{background:#f8fafc;}
        .info-box{border:2px solid #bfdbfe;border-radius:6px;padding:10px;margin-bottom:10px;background:#eff6ff;}
        .info-row{display:flex;gap:20px;margin-bottom:4px;font-size:14px;}
        .info-label{font-weight:bold;min-width:60px;color:#1e40af;}
        .footer{margin-top:16px;font-size:11px;color:#999;text-align:center;}
      </style>
      <h2>📋 출고 제품 목록</h2>
      <div class="meta">등록: ${o.user} · ${o.time} · 상태: ${o.status==='done'?'확인완료':'신규'}</div>
      <div class="info-box">
        <div class="info-row"><span class="info-label">납품처</span><span style="font-size:16px;font-weight:bold;">${clientInfo}</span></div>
      </div>
      <table>
        <thead><tr><th>카테고리</th><th>제품명</th><th>박스 수</th><th>포장단위</th><th>캡 여부</th></tr></thead>
        <tbody>${itemsRows}</tbody>
      </table>
      <div class="footer">인쇄일시: ${nowStr()}</div>
    `;

    const pa=document.getElementById('printArea');
    pa.style.display='block';
    pa.innerHTML=printHTML;

    setTimeout(()=>{
      window.print();
      pa.style.display='none';
      pa.innerHTML='';
    },200);
  });
};

// ===== 지원팀: 차량 조회 =====
function renderVehicleSearch(c){
  c.innerHTML=`<div class="section">
    <div class="section-title">🔍 차량 조회</div>
    <div class="search-wrap">
      <span class="search-icon">🚛</span>
      <input class="search-input" placeholder="차량번호 4자리" maxlength="4" oninput="searchVehicle(this.value)">
    </div>
    <div id="vehSearchResult"></div>
  </div>
  <div class="section">
    <div class="section-title">🚛 전체 차량 목록</div>
    <div id="allVehicles">${renderAllVehicles()}</div>
  </div>`;
}

function renderAllVehicles(){
  const list=Object.values(vehicles);
  if(!list.length) return '<div class="empty-msg">등록된 차량 없음</div>';
  return list.map(v=>`<div class="vehicle-card">
    <div class="vehicle-num">${v.num}</div>
    <div class="vehicle-meta">${v.driver||''} · ${v.phone||''}</div>
    <div class="vehicle-meta">📐 ${v.len}×${v.wid}×${v.ht} cm</div>
  </div>`).join('');
}

window.searchVehicle = function(q){
  const r=document.getElementById('vehSearchResult');
  if(!r) return;
  if(q.length<4){r.innerHTML='';return;}
  const v=Object.values(vehicles).find(x=>x.num===q);
  r.innerHTML=v
    ?`<div class="vehicle-info"><div class="vehicle-title">🚛 ${v.num} ${v.driver||''}</div><div class="vehicle-detail">📞 ${v.phone||'-'} · ${v.len}×${v.wid}×${v.ht} cm</div></div>`
    :`<div style="color:var(--gray);font-size:13px;padding:8px;">등록된 차량이 없습니다</div>`;
};

// headerUser fix
function roleLabel(r){return r==='sales'?'영업팀':r==='support'?'생산지원팀':'관리자';}
window.doLogin = function(){
  if(!curUser) return;
  document.getElementById('loginScreen').style.display='none';
  const m=document.getElementById('mainApp');
  m.style.display='flex';
  document.getElementById('headerUser').textContent=curUser.name+' ('+roleLabel(curRole)+')';
  document.getElementById('salesTabs').style.display=curRole==='sales'||curRole==='admin'?'flex':'none';
  document.getElementById('supportTabs').style.display=curRole==='support'||curRole==='admin'?'flex':'none';
  loadVehicles();
  if(curRole==='sales'||curRole==='admin') showTab('sales','reg');
  else showTab('support','list');
};
